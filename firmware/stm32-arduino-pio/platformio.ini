; STM32F103C8 Blue Pill — Arduino framework (STM32duino), cùng giao thức với bản HAL CMake.
;
; build_dir: GCC ld trên Windows hay lỗi "cannot find @...tmp: Invalid argument" khi
; đường dẫn dự án có ký tự Unicode (vd. "Bài tập lớn"). Đặt artefact build ở path ASCII.
[platformio]
build_dir = C:/pio-build/stm32-arduino-pio-bp

[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = arduino
monitor_speed = 115200
upload_protocol = stlink
build_flags =
    -Os
