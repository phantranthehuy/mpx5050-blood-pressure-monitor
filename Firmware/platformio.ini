; STM32F103C8 Blue Pill — blood pressure cuff controller + ADS1115 + UART bridge
[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = stm32cube
upload_protocol = stlink
monitor_speed = 115200
build_flags =
    -DUSE_HAL_DRIVER
    -DSTM32F103xB
    -Wno-unused-parameter
    -I${PROJECT_DIR}/include
lib_ldf_mode = deep+
